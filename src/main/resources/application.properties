# Application
spring.application.name=semantic-search-engine
server.port=8082

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/semantic_search}
spring.datasource.username=${DB_USERNAME:search_user}
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Ollama
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
ollama.chat-model=qwen3.5:4b

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Hybrid retrieval
search.candidate-limit=10
search.min-similarity=0.50

# RAG context selection
search.rag.limit=3

# MMR: higher lambda favors relevance; lower lambda favors diversity
search.mmr.lambda=0.7