# Application
spring.application.name=semantic-search-engine

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/semantic_search}
spring.datasource.username=${DB_USERNAME:search_user}
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Ollama
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}