# Dedicated database for semantic search evaluation tests
#spring.datasource.url=jdbc:postgresql://localhost:5433/semantic_search_eval
#spring.datasource.username=search_user
#spring.datasource.password=local_dev_password

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/semantic_search}
spring.datasource.username=${DB_USERNAME:search_user}
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Ollama embedding configuration
ollama.base-url=http://localhost:11434
ollama.embedding-model=nomic-embed-text:latest
ollama.chat-model=qwen3.5:4b

# Hybrid retrieval
search.candidate-limit=10
search.min-similarity=0.50

# RAG context selection
search.rag.limit=3

# MMR: higher lambda favors relevance; lower lambda favors diversity
search.mmr.lambda=0.7